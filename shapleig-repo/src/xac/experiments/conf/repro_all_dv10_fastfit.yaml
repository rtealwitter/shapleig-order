application:
  _target_: xac.applications.ShapiqShapleyApplication
  init_design_factor: 1

blackbox:
  _target_: xac.blackbox_functions.ShapIQPrecomputedGameBBF
  name: lcbench_189862
  seed: ${meta.seed}

meta:
  _target_: xac.experiments.MetaExperimentConfig
  seed: 0
  debug_mode: true
  skip_fitting: false
  time_ops: true
  scalability_mode: true

surrogate:
  _target_: xac.surrogates.GPSurrogateConfig
  kernel_config:
    _target_: xac.surrogates.HammingKernelConfig
    min_lengthscale: 1e-6
  missing_strategy: mean
  warp: false
  fit_config:
    _target_: xac.surrogates.AcceleratedFitConfig
    optimizer: default
    amount_restarts: 5
    run_all_attempts: false
    warmstart: false
    refit_interval: 1
    use_iterative: true
    inducing_points: null
    fold_odd_part: true
  noise_config:
    _target_: xac.surrogates.ConstantNoiseConfig
    noise_level: 1e-6

experimental_design:
  _target_: xac.experimental_designs.ExperimentalDesignConfig
  iterations: 512

acquisition:
  _target_: xac.acquisition_functions.PairedExtremes

acquisition_optimizer:
  _target_: xac.acquisition_optimizers.Exhaustive

defaults:
  - _self_
  - hydra/callbacks@_global_: aggregator
  - override hydra/launcher: joblib

hydra:
  mode: MULTIRUN
  launcher:
    n_jobs: 90
  sweeper:
    params:
      blackbox.name: dvbsgb_10,dvchgb_10,dvbsrf_10
      acquisition._target_: xac.acquisition_functions.PairedExtremes,xac.acquisition_functions.HybridPairedEIG
      meta.seed: range(1,31)
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: single_runs/${hydra.job.num}
